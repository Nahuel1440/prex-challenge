name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Start the server
        run: |
          mkdir -p "$RUNNER_TEMP/cutoff"
          CUT_OFF_DIR="$RUNNER_TEMP/cutoff" target/release/prex_processor &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          echo "server did not become healthy in 30 s" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes newman@6 run postman/prex-challenge.postman_collection.json
      - name: Stop the server
        if: always()
        run: kill "$SERVER_PID" || true
